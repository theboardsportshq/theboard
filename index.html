<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Model projections for NFL, college football and NBA games. Picks locked when posted, graded in public.">
<title>The Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: an edition of The Board. Paper page, forest-green masthead and record band, moss rules between sections, game cards set like a sports desk. Colours sampled from @theboardsportshq; a deliberate single light look to match the brand. */
:root {
  --paper: #f4f5f0; --card: #fbfaf5; --ink: #10231d; --forest: #10231d; --forest-2: #16291c;
  --moss: #77964a; --moss-soft: #abbd8e; --rule: #d9ddd0; --muted: #5d6a60; --cream: #efe4c8;
  --display: "Geist", "Helvetica Neue", Arial, sans-serif;
  --body: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
a { color: inherit; }
.wrap { max-width: 980px; margin-inline: auto; padding-inline: 16px; padding-block: 0 56px; }
.lbl, .when, .sub, nav.sports button, .filters button, .chip, .status { font-family: var(--body); letter-spacing: .12em; text-transform: uppercase; }

/* masthead */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 14px; border-bottom: 2px solid var(--moss); }
.mark { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.mono { position: relative; width: 34px; height: 40px; font-family: var(--display); font-weight: 900; color: var(--ink); }
.mono b { position: absolute; font-size: 2.4rem; line-height: 1; }
.mono b:first-child { left: 0; top: -2px; }
.mono b:last-child { left: 9px; top: 2px; }
.mark .name { display: grid; line-height: 1.05; border-left: 1px solid var(--ink); padding-left: 12px; }
.mark .name strong { font-family: var(--display); font-weight: 800; font-size: 1.35rem; letter-spacing: .03em; text-transform: uppercase; }
.mark .name small { font-size: .58rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
nav.sports { display: flex; flex-wrap: wrap; gap: 4px; }
nav.sports button { font-weight: 600; font-size: .7rem; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 6px 8px; cursor: pointer; }
nav.sports button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--moss); }
nav.sports button:focus-visible, .filters button:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

/* hero */
.hero { padding-block: 40px 26px; display: grid; gap: 12px; }
.hero .kicker { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--moss); font-weight: 600; }
.hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.8rem, 9vw, 5.4rem); line-height: .95; margin: 0; text-wrap: balance; }
.hero h1 em { font-weight: 600; font-style: italic; color: var(--moss); }
.hero p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 1rem; }

/* record band */
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 1px; background: var(--forest-2); border-radius: 2px; overflow: hidden; }
.strip > div { background: var(--forest); color: var(--paper); padding: 16px 18px; }
.strip .lbl { font-size: .62rem; color: var(--moss-soft); font-weight: 600; }
.big { font-family: var(--display); font-weight: 800; font-size: 2rem; color: var(--cream); margin-top: 2px; font-variant-numeric: lining-nums tabular-nums; }
.strip .sub { font-size: .6rem; color: #c9d1c4; letter-spacing: .14em; }

/* board */
section { margin-top: 40px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
h2 { font-family: var(--display); font-weight: 800; font-size: 2rem; margin: 0; }
.sec-head .sub { font-size: .62rem; color: var(--moss); font-weight: 600; }
.board-note { font-size: .85rem; color: var(--muted); margin: 0 0 12px; max-width: 70ch; }
.filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filters button { font-weight: 600; font-size: .64rem; color: var(--muted); background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 10px; cursor: pointer; }
.filters button[aria-pressed="true"] { color: var(--paper); background: var(--forest); border-color: var(--forest); }
.games { display: grid; gap: 8px; }
.game { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px 20px; align-items: center; }
.game.pick { border-left: 3px solid var(--moss); }
.teams { display: grid; gap: 4px; min-width: 0; }
.trow { display: flex; align-items: center; gap: 10px; }
.abbr { font-family: var(--display); font-weight: 800; font-size: 1.35rem; width: 3.4ch; }
.abbr.long { width: auto; flex: 1; min-width: 0; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .abbr.long + .score { margin-left: auto; }
.score { font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--ink); min-width: 3.6ch; text-align: right; font-variant-numeric: lining-nums tabular-nums; }
.when { font-size: .6rem; color: var(--moss); font-weight: 600; }
.col { display: grid; gap: 4px; min-width: 0; }
.kv { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.kv span:first-child { color: var(--muted); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; padding-top: 2px; }
.call { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; font-weight: 600; }
.chip { font-weight: 700; font-size: .58rem; padding: 3px 7px; border-radius: 2px; }
.chip.pick { background: var(--forest); color: var(--cream); }
.chip.lean { border: 1px solid var(--rule); color: var(--muted); font-weight: 600; }
.edge { color: var(--muted); font-weight: 500; }
.game.pick .edge { color: var(--moss); }
@media (max-width: 640px) {
  .game { grid-template-columns: 1fr 1fr; }
  .teams { grid-column: 1 / -1; }
}

/* sports */
.sports-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.sport { background: var(--card); border: 1px solid var(--rule); border-top: 3px solid var(--rule); border-radius: 2px; padding: 16px; display: grid; gap: 4px; }
.sport:has(.live) { border-top-color: var(--moss); }
.sport h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.status { font-weight: 700; font-size: .6rem; }
.status.live { color: var(--moss); }
.status.soon { color: var(--muted); }
.sport .sub { font-size: .8rem; color: var(--muted); }

/* how */
.how-band { background: var(--forest); color: var(--paper); padding: 28px 22px; border-radius: 2px; }
.how-band h2 { color: var(--paper); margin-bottom: 16px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 20px; }
.how h3 { font-family: var(--display); font-weight: 600; font-style: italic; font-size: 1.35rem; margin: 0 0 6px; color: var(--cream); }
.how p { margin: 0; color: #c9d1c4; font-size: .92rem; }
.rec-table { overflow-x: auto; margin-top: 14px; background: var(--card); border: 1px solid var(--rule); border-radius: 2px; }
.rec-table table { width: 100%; border-collapse: collapse; min-width: 620px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.rec-table th { text-align: left; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.rec-table td { padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.rec-table td.strong { font-weight: 700; }
.rec-table tr:last-child td { border-bottom: 0; }
.panel-empty { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 28px 20px; color: var(--muted); }
.panel-empty strong { display: block; font-family: var(--display); font-size: 1.8rem; color: var(--ink); margin-bottom: 4px; }
footer { margin-top: 40px; padding-top: 14px; border-top: 2px solid var(--moss); color: var(--muted); font-size: .78rem; display: grid; gap: 6px; }
footer .tag { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) {
  .game { animation: rise .45s ease-out both; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}

/* v2 additions: edition front page, edges, breakdowns, method */
.hero .edition { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .64rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.hero .edition span + span::before { content: "/"; margin-right: 14px; color: var(--rule); }
.hero h1 .line2 { display: block; font-weight: 600; font-style: italic; color: var(--moss); font-size: .62em; margin-top: 6px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.cta { font: 700 .66rem var(--body); letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px; border-radius: 2px; border: 1px solid var(--forest); background: var(--forest); color: var(--cream); cursor: pointer; }
.cta.ghost { background: transparent; color: var(--ink); }
.cta:focus-visible, .game-head:focus-visible, .edge-row:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

.top-edges { display: grid; gap: 0; background: var(--card); border: 1px solid var(--rule); border-radius: 2px; }
.edge-row { display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--rule); background: transparent; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.edge-row:last-child { border-bottom: 0; }
.edge-row:hover { background: #f1f3ec; }
.edge-row .n { font-family: var(--display); font-weight: 800; font-size: 1.5rem; color: var(--moss); text-align: center; }
.edge-row .what { min-width: 0; display: grid; gap: 2px; }
.edge-row .what strong { font-family: var(--display); font-weight: 800; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edge-row .what span { font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edge-row .pts { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-align: right; font-variant-numeric: lining-nums tabular-nums; }
.edge-row .pts small { display: block; font-family: var(--body); font-size: .56rem; letter-spacing: .14em; color: var(--muted); font-weight: 600; }

.duo { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 8px; }
.board-card { background: var(--card); border: 1px solid var(--rule); border-top: 3px solid var(--moss); border-radius: 2px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.board-card h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.6rem; }
.board-card p { margin: 0; color: var(--muted); font-size: .9rem; }
.board-card .nums { display: flex; gap: 22px; }
.board-card .nums div { display: grid; }
.board-card .nums b { font-family: var(--display); font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
.board-card .nums span { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* game card with breakdown */
.game { display: block; padding: 0; }
.game-head { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr) 1.2rem; gap: 10px 20px; align-items: center; padding: 14px 16px; width: 100%; border: 0; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.game-head .chev { width: 10px; height: 10px; border-right: 2px solid var(--moss); border-bottom: 2px solid var(--moss); transform: rotate(45deg); justify-self: end; transition: transform .2s; }
.game.open .game-head .chev { transform: rotate(-135deg); }
.detail { border-top: 1px solid var(--rule); padding: 16px; display: grid; gap: 16px; }
.detail[hidden] { display: none; }
.detail .wpbar { display: grid; gap: 6px; }
.wp-labels { display: flex; justify-content: space-between; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.wp-labels b { color: var(--ink); font-family: var(--display); font-size: 1rem; letter-spacing: 0; }
.wp-track { height: 8px; background: var(--rule); border-radius: 1px; overflow: hidden; display: flex; }
.wp-track i { display: block; height: 100%; }
.wp-track i:first-child { background: var(--moss-soft); }
.wp-track i:last-child { background: var(--forest); }
.cmp { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.cmp th { font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.cmp th:first-child, .cmp td:first-child { text-align: left; padding-left: 0; }
.cmp td { padding: 7px 8px; border-bottom: 1px solid var(--rule); text-align: right; }
.cmp td small { color: var(--muted); margin-left: 4px; font-size: .7rem; }
.cmp td.lead { font-weight: 700; color: var(--forest); }
.cmp-wrap { overflow-x: auto; }
.why { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .9rem; }
.why li::marker { color: var(--moss); }
.mini-lbl { font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--moss); font-weight: 700; margin-bottom: 6px; }
.move { font-size: .88rem; color: var(--muted); }
.note-line { font-size: .85rem; background: #eef1e6; border-left: 3px solid var(--moss); padding: 8px 10px; }
@media (max-width: 640px) {
  .game-head { grid-template-columns: 1fr 1fr 1.2rem; }
  .game-head .teams { grid-column: 1 / -1; }
}

/* edges table */
.edges-table { overflow-x: auto; background: var(--card); border: 1px solid var(--rule); border-radius: 2px; }
.edges-table table { width: 100%; border-collapse: collapse; min-width: 640px; font-size: .88rem; font-variant-numeric: tabular-nums; }
.edges-table th { text-align: left; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
.edges-table td { padding: 10px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.edges-table td.pk { font-family: var(--display); font-weight: 800; font-size: 1.02rem; }
.edges-table td.ed { font-family: var(--display); font-weight: 800; color: var(--moss); }
.edges-table tr:last-child td { border-bottom: 0; }
.edges-table tr[data-go] { cursor: pointer; }
.edges-table tr[data-go]:hover td { background: #f1f3ec; }

/* method */
.method { display: grid; gap: 28px; }
.method p { margin: 0; max-width: 68ch; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 8px; }
.step { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 16px; display: grid; gap: 6px; align-content: start; }
.step .k { font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--moss); font-weight: 700; }
.step h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.25rem; }
.step p { color: var(--muted); font-size: .9rem; }
.proof { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 1px; background: var(--forest-2); border-radius: 2px; overflow: hidden; }
.proof > div { background: var(--forest); color: var(--paper); padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.proof .lbl { color: var(--moss-soft); font-size: .6rem; font-weight: 700; }
.proof .big { font-size: 1.8rem; }
.proof .sub { color: #c9d1c4; font-size: .78rem; letter-spacing: 0; text-transform: none; }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 70ch; }
.rules li::marker { color: var(--moss); }
.coming { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: .64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.coming b { color: var(--ink); }

/* margin builder */
.builder { display: grid; gap: 6px; }
.b-axis { display: flex; justify-content: space-between; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.b-row { display: grid; grid-template-columns: minmax(0, 9.5rem) 1fr; gap: 10px; align-items: center; font-size: .82rem; }
.b-row .nm { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.b-track { position: relative; height: 18px; background: linear-gradient(var(--rule), var(--rule)) center / 1px 100% no-repeat; }
.b-bar { position: absolute; top: 3px; height: 12px; border-radius: 1px; }
.b-bar.home { background: var(--forest); }
.b-bar.away { background: var(--moss-soft); }
.b-val { position: absolute; top: 0; font-size: .72rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 18px; white-space: nowrap; }
.b-total { display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 8px; font-size: .85rem; }
.b-total b { font-family: var(--display); font-size: 1.05rem; }

/* teams view */
.map-card { background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: 14px; }
.map-card svg { display: block; width: 100%; height: auto; }
.map-card text { font-family: var(--body); }
.odds-table { overflow-x: auto; background: var(--card); border: 1px solid var(--rule); border-radius: 2px; }
.odds-table table { width: 100%; border-collapse: collapse; min-width: 720px; font-size: .85rem; font-variant-numeric: tabular-nums; }
.odds-table th { text-align: right; font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--rule); cursor: pointer; white-space: nowrap; background: var(--card); position: sticky; top: 0; }
.odds-table th:first-child, .odds-table td:first-child, .odds-table th:nth-child(2), .odds-table td:nth-child(2) { text-align: left; }
.odds-table th[aria-sort] { color: var(--ink); }
.odds-table td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
.odds-table td.tm { font-family: var(--display); font-weight: 800; font-size: 1rem; }
.odds-table td.pc { position: relative; }
.odds-table td.pc span { position: relative; z-index: 1; }
.odds-table td.pc i { position: absolute; right: 0; top: 6px; bottom: 6px; background: #e3e9d6; z-index: 0; }
.odds-table tr:last-child td { border-bottom: 0; }

/* market follow */
.mk { font-weight: 700; }
.mk.with { color: var(--moss); }
.mk.against { color: #9b4a3a; }
.mk.flat { color: var(--muted); font-weight: 500; }

/* type: minimal. One sans at medium weight, mono numbers, sentence case */
.hero h1, h2, h3, .mark .name strong, .mono b, .abbr, .board-card h3, .sport h3, .step h3, .how h3, .panel-empty strong,
.edge-row .what strong, .odds-table td.tm, .edges-table td.pk { font-weight: 500; text-transform: none; letter-spacing: -0.01em; font-style: normal; }
.hero h1 { font-size: clamp(2.2rem, 6.5vw, 3.6rem); line-height: 1.05; letter-spacing: -0.03em; }
.hero h1 em, .hero h1 .line2 { font-style: normal; font-weight: 400; color: var(--muted); font-size: .62em; letter-spacing: -0.02em; }
h2 { font-size: 1.35rem; letter-spacing: -0.015em; }
.mark .name strong { font-size: 1rem; letter-spacing: .02em; text-transform: uppercase; }
.mono b { font-weight: 600; font-size: 2rem; }
.abbr { font-size: 1.05rem; } .abbr.long { font-size: 1rem; }
.board-card h3, .sport h3 { font-size: 1.15rem; }
.step h3, .how h3 { font-size: 1.05rem; color: inherit; }
.how h3 { color: var(--cream); }
.score, .big, .edge-row .n, .edge-row .pts, .board-card .nums b, .edges-table td.ed, .b-total b, .wp-labels b,
.kv span:last-child, .cmp td, .b-val, .odds-table td, .rec-table td, .edges-table td { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.score { font-weight: 500; font-size: 1rem; }
.big { font-weight: 400; font-size: 1.7rem; letter-spacing: -0.02em; }
.edge-row .n, .edge-row .pts, .board-card .nums b { font-weight: 400; }
.edges-table td.ed, .b-total b, .wp-labels b { font-weight: 500; }
.edge-row .what strong, .edges-table td.pk { font-family: var(--body); font-size: 1rem; }
.odds-table td.tm, .edges-table td:nth-child(4), .rec-table td:nth-child(2), .edges-table td:nth-child(2) { font-family: var(--body); }
.chip { font-weight: 600; }

/* rounded corners */
:root { --r: 14px; --r-sm: 8px; }

      const inj = el('div'); inj.appendChild(el('div', 'mini-lbl', 'Injury report'));
      const ul = el('ul', 'why');
      [[g.away, g.injuries.away], [g.home, g.injuries.home]].forEach(([t, xs]) => {
        ul.appendChild(el('li', null, t + ': ' + (xs && xs.length ? xs.map(x => (x.name || x.player) + (x.status ? ' (' + x.status.toLowerCase() + ')' : '')).join(', ') : 'no rotation players out')));
      });
      const restNote = [];
      if (g.b2b.away) restNote.push(g.away + ' on the second night of a back-to-back');
      if (g.b2b.home) restNote.push(g.home + ' on the second night of a back-to-back');
      if (restNote.length) ul.appendChild(el('li', null, restNote.join('; ')));
      inj.appendChild(ul); box.appendChild(inj);
      head.addEventListener('click', () => { const open = box.hidden; box.hidden = !open; c.classList.toggle('open', open); head.setAttribute('aria-expanded', String(open)); });
      c.append(head, box); list.appendChild(c);
    });
    sec.appendChild(list); view.appendChild(sec);

    const s2 = section('Power ratings', 'Points better than an average team on a neutral court');
    s2.appendChild(el('p', 'board-note', 'Solved against each team\'s whole schedule from points per 100 possessions, weighted toward recent games. Early in the season they lean on preseason win totals and fade toward this season\'s results as games are played.'));
    const rw = el('div', 'odds-table'); const rt = el('table'); const rh = el('tr');
    ['#', 'Team', 'Power', 'Offense', 'Defense', 'Pace', 'Games'].forEach(x => rh.appendChild(el('th', null, x)));
    const rth = el('thead'); rth.appendChild(rh); rt.appendChild(rth); const rb = el('tbody');
    const pmax = Math.max(...NBA.ratings.map(r => Math.abs(r.power)));
    NBA.ratings.forEach(r => {
      const tr = el('tr'); tr.append(el('td', null, String(r.rank)), el('td', 'tm', r.team));
      const td = el('td', 'pc'); const bar = el('i'); bar.style.width = Math.abs(r.power) / pmax * 100 + '%'; if (r.power < 0) bar.style.background = '#efe1dc';
      td.append(bar, el('span', null, sgn(r.power))); tr.appendChild(td);
      tr.append(el('td', null, sgn(r.off)), el('td', null, sgn(r.dfn)), el('td', null, r.pace.toFixed(1)), el('td', null, String(r.games)));
      rb.appendChild(tr);
    });
    rt.appendChild(rb); rw.appendChild(rt); s2.appendChild(rw); view.appendChild(s2);

    const s3 = section('Player impact', 'Who costs his team the most when he sits');
    s3.appendChild(el('p', 'board-note', 'Impact is how much better each player\'s team does with him on the floor, adjusted for the nine other players out there with him (points per 48 minutes vs an average player, weighted toward recent seasons). Cost if out is what the model takes off his team\'s number when he misses a game, given his usual minutes. Team is the one he last played for.'));
    const pw = el('div', 'odds-table'); const pt = el('table'); const ph = el('tr');
    ['#', 'Player', 'Team', 'Cost if out', 'Impact / 48', 'Minutes'].forEach(x => ph.appendChild(el('th', null, x)));
    const pth = el('thead'); pth.appendChild(ph); pt.appendChild(pth); const pb = el('tbody');
    const vmax = Math.max(...NBA.players.map(x => x.cost || 0));
    NBA.players.slice(0, 25).forEach(x => {
      const tr = el('tr'); tr.append(el('td', null, String(x.rank)), el('td', 'tm', x.name), el('td', null, x.team));
      const td = el('td', 'pc'); const bar = el('i'); bar.style.width = (x.cost || 0) / vmax * 100 + '%'; td.append(bar, el('span', null, '−' + (x.cost || 0).toFixed(1) + ' pts')); tr.appendChild(td);
      tr.append(el('td', null, x.impact == null ? '—' : sgn(x.impact)), el('td', null, x.minutes.toFixed(1))); pb.appendChild(tr);
    });
    pt.appendChild(pb); pw.appendChild(pt); s3.appendChild(pw); view.appendChild(s3);

    const R4 = NBA.record; const s4 = section('Leans record', R4.w + '-' + R4.l + '-' + R4.p + (R4.open ? ' · ' + R4.open + ' pending' : ''));
    s4.appendChild(el('p', 'board-note', 'Every lean is locked at the line shown when it went up and graded at that line after the game. They count toward the record here and nowhere else until they earn it.'));
    if (NBA.leans.length) {
      const lw2 = el('div', 'rec-table'); const lt2 = el('table'); const lh2 = el('tr');
      ['Date', 'Game', 'Lean', 'Edge', 'Final', 'Result'].forEach(x => lh2.appendChild(el('th', null, x)));
      const lth2 = el('thead'); lth2.appendChild(lh2); lt2.appendChild(lth2); const lb2 = el('tbody');
      NBA.leans.slice().reverse().forEach(r => {
        const tr = el('tr'); tr.append(el('td', null, day(r.day)), el('td', null, r.away + ' @ ' + r.home), el('td', 'strong', r.side + ' ' + sgn(r.line)), el('td', null, r.edge.toFixed(1)), el('td', null, r.final || '—'));
        const res = el('td'); res.appendChild(el('span', 'chip ' + (r.result === 'win' ? 'pick' : 'lean'), r.result === 'open' ? 'Pending' : r.result)); tr.appendChild(res);
        lb2.appendChild(tr);
      });
      lt2.appendChild(lb2); lw2.appendChild(lt2); s4.appendChild(lw2);
    } else s4.appendChild(el('p', 'board-note', 'No leans yet.'));
    view.appendChild(s4);
  }

  // ------------------------------------------------------------------- edges
  function edges() {
    const P = allPicks();
    const sec = section('Biggest edges', P.length + ' picks this week, ranked by points of disagreement with the market');
    sec.appendChild(el('p', 'board-note', 'The edge is how far the model\'s number is from the betting line. Bigger edges have historically been right more often, and only at the line posted here: the edge shrinks as the market moves.'));
    sec.appendChild(edgeRows(P.slice(0, 5)));
    const wrap = el('div', 'edges-table'); wrap.style.marginTop = '12px';
    const t = el('table'); const hr = el('tr'); ['#', 'Pick', 'Edge', 'Game', 'Model', 'Market', 'Kickoff'].forEach(x => hr.appendChild(el('th', null, x)));
    const th = el('thead'); th.appendChild(hr); t.appendChild(th); const tb = el('tbody');
    P.forEach(({ sp, g }, i) => {
      const r = el('tr'); r.dataset.go = sp;
      r.append(el('td', null, String(i + 1)), el('td', 'pk', g.pick), el('td', 'ed', g.edge.toFixed(1)),
        el('td', null, SPORTS[sp].label + ' · ' + g.away + ' @ ' + g.home), el('td', null, g.model_line), el('td', null, g.mkt_line), el('td', null, day(g.kick)));
      r.addEventListener('click', () => { pendingOpen = g.id; go(sp); });
      tb.appendChild(r);
    });
    t.appendChild(tb); wrap.appendChild(t); sec.appendChild(wrap); view.appendChild(sec);
  }

  // ------------------------------------------------------------------ record
  function record() {
    view.appendChild(recordBand());
    const sec = section('Every pick', LEDGER.length + ' picks locked');
    sec.appendChild(el('p', 'board-note', 'Each pick is locked at the line it was posted at and graded there. The closing line appears once the game is final: getting a better number than the close is the best long-run sign the model is right.'));
    const tiles = el('div', 'sports-grid');
    Object.entries(SPORTS).forEach(([k, D]) => {
      const t = tally(LEDGER.filter(r => r.sport === k));
      const c = el('div', 'sport'); c.appendChild(el('span', 'status live', D.long));
      c.appendChild(el('h3', null, t.w + '-' + t.l + '-' + t.p));
      c.appendChild(el('span', 'sub', (t.pct === null ? 'No results yet' : (t.pct * 100).toFixed(1) + '% · ' + (t.units >= 0 ? '+' : '') + t.units.toFixed(1) + 'u') + ' · ' + t.o + ' pending'));
      if (t.ncl) c.appendChild(el('span', 'sub', 'Beat the close ' + t.beat + ' of ' + t.ncl + ' (' + sgn(t.clv) + ' pts avg)'));
      const mf = follow(LEDGER.filter(r => r.sport === k));
      c.appendChild(el('span', 'sub', mf.moved ? 'Market moved toward us ' + mf.with + ' of ' + mf.moved : 'No line moves yet'));
      tiles.appendChild(c);
    });
    sec.appendChild(tiles);
    const wrap = el('div', 'rec-table'); const tb = el('table'); const hr = el('tr');
    ['Date', 'Game', 'Pick', 'Edge', 'Line now', 'Market', 'Final', 'Result'].forEach(x => hr.appendChild(el('th', null, x)));
    const th = el('thead'); th.appendChild(hr); tb.appendChild(th); const body = el('tbody');
    LEDGER.slice().sort((a, b) => (a.kickoff < b.kickoff ? 1 : a.kickoff > b.kickoff ? -1 : b.edge - a.edge)).forEach(r => {
      const tr = el('tr');
      tr.append(el('td', null, day(r.kickoff)), el('td', null, (r.sport === 'nfl' ? 'NFL · ' : 'CFB · ') + r.away + ' @ ' + r.home),
        el('td', 'strong', r.side + ' ' + sgn(r.line)), el('td', null, r.edge.toFixed(1)));
      const ref = r.close_line != null ? r.close_line : r.latest_line;
      tr.appendChild(el('td', null, ref == null ? '—' : sgn(ref) + (r.close_line != null ? ' close' : '')));
      const mv = ref == null ? null : r.line - ref;
      const mcell = el('td'); mcell.appendChild(mv === null || Math.abs(mv) < 0.05 ? el('span', 'mk flat', 'No move yet') : el('span', 'mk ' + (mv > 0 ? 'with' : 'against'), (mv > 0 ? 'Toward us ' : 'Away ') + Math.abs(mv).toFixed(1)));
      tr.appendChild(mcell);
      tr.appendChild(el('td', null, r.away_score == null ? '—' : r.away_score + '-' + r.home_score));
      const res = el('td'); res.appendChild(el('span', 'chip ' + (r.result === 'win' ? 'pick' : 'lean'), r.result === 'open' ? 'Pending' : r.result));
      tr.appendChild(res); body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb); sec.appendChild(wrap); view.appendChild(sec);
    const T = TLEANS || [];
    const tw = T.filter(r => r.result === 'win').length, tl = T.filter(r => r.result === 'loss').length, tp = T.filter(r => r.result === 'push').length;
    const s2 = section('NFL total leans', T.length ? tw + '-' + tl + '-' + tp + ' · ' + T.filter(r => r.result === 'open').length + ' pending' : 'From week 7');
    s2.appendChild(el('p', 'board-note', 'Overs and unders where the model is 3+ points off the total when lines open. From 2019 to 2024 these went 295-228 (56.4%) in testing, but only 49-50 in 2025 and 2026, so they are tracked here in public and do not count as picks until the live record earns it.'));
    if (T.length) {
      const w2 = el('div', 'rec-table'); const t2 = el('table'); const h2 = el('tr');
      ['Week', 'Game', 'Lean', 'Model', 'Edge', 'Final', 'Result'].forEach(x => h2.appendChild(el('th', null, x)));
      const th2 = el('thead'); th2.appendChild(h2); t2.appendChild(th2); const b2 = el('tbody');
      T.slice().reverse().forEach(r => { const tr = el('tr');
        tr.append(el('td', null, String(r.week)), el('td', null, r.away + ' @ ' + r.home), el('td', 'strong', (r.side === 'over' ? 'Over ' : 'Under ') + r.line), el('td', null, r.model.toFixed(1)), el('td', null, r.edge.toFixed(1)), el('td', null, r.final || '—'));
        const rc = el('td'); rc.appendChild(el('span', 'chip ' + (r.result === 'win' ? 'pick' : 'lean'), r.result === 'open' ? 'Pending' : r.result)); tr.appendChild(rc); b2.appendChild(tr); });
      t2.appendChild(b2); w2.appendChild(t2); s2.appendChild(w2);
    }
    view.appendChild(s2);
  }

  // ------------------------------------------------------------------ method
  function method() {
    const M = META.method;
    const hero = el('div', 'hero');
    hero.append(el('span', 'kicker', 'The Board / Method'));
    const h1 = el('h1'); h1.append('How the number is made.'); h1.appendChild(el('span', 'line2', 'And how it has held up.')); hero.appendChild(h1);
    hero.appendChild(el('p', null, 'The Board is built to be checked. Every projection comes from the same code, nothing is entered by hand, and every pick is graded at the line it was posted at.'));
    view.appendChild(hero);
    const wrap = el('div', 'method');

    const s1 = section('Three steps'); const steps = el('div', 'steps');
    [['Step 1', 'Rate every team', 'Each team gets a rating in points, solved against its whole schedule at once, from scores and play-by-play efficiency (expected points added per play). Recent games count most.'],
     ['Step 2', 'Adjust for the game', 'Home field, rest, neutral sites, a change at quarterback and injuries to key players move the number before it is posted.'],
     ['Step 3', 'Compare with the market', 'The projection goes beside the DraftKings line. A pick needs a set edge: 3 points in the NFL, 2 in college football. Totals are shown, not picked, this week.']
    ].forEach(([k, h, p]) => { const d = el('div', 'step'); d.append(el('span', 'k', k), el('h3', null, h), el('p', null, p)); steps.appendChild(d); });
    s1.appendChild(steps); wrap.appendChild(s1);

    const s2 = section('What the testing shows', 'Every game predicted only from data before it');
    const proof = el('div', 'proof');
    const cell = (lbl, big, sub) => { const d = el('div'); d.append(el('span', 'lbl', lbl), el('span', 'big', big), el('span', 'sub', sub)); return d; };
    proof.append(
      cell('NFL picks at the opening line', M.nfl_open.pct, M.nfl_open.rec + ' with a 3+ point edge, ' + M.nfl_open.span),
      cell('NFL line moved toward the pick', M.nfl_move.pct, M.nfl_move.rec + ' times after the open'),
      cell('College line moved toward the pick', M.cfb_move.pct, M.cfb_move.rec + ' times, 2+ point edges, ' + M.cfb_move.span),
      cell('Break-even at -110', '52.4%', 'Win rate needed to profit at standard odds'));
    s2.appendChild(proof);
    const p2 = el('p', null, M.honest); s2.appendChild(p2);
    wrap.appendChild(s2);

    const s3 = section('The rules');
    const ul = el('ul', 'rules');
    ['Boards go up as soon as lines open, because that is where the edge has been.',
     'Every pick is locked at the line shown when it is posted and never re-priced.',
     'Results are graded at the posted line, with the closing line shown beside it.',
     'College football picks start in week 4, once there is enough of this season to rate teams on.',
     'A college game whose line has moved 4+ points since it opened gets no pick: that usually means news the model can\'t see.',
     'Units assume 1 unit to win at -110 odds on every pick.'].forEach(x => ul.appendChild(el('li', null, x)));
    s3.appendChild(ul); wrap.appendChild(s3);

    const s4 = section('Coming next');
    s4.appendChild(el('p', null, 'NBA for opening night, college basketball in November and MLB for Opening Day 2027, each tested the same way before it goes live.'));
    wrap.appendChild(s4);
    view.appendChild(wrap);
  }

  const views = { edition, nfl: () => board('nfl'), ncaaf: () => board('ncaaf'), td, nba, edges, teams, record, method };
  function go(v) {
    if (!views[v]) v = 'edition';
    document.querySelectorAll('nav.sports button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    view.innerHTML = '';
    views[v]();
    try { history.replaceState(null, '', '#' + v); } catch (e) {}
    if (!pendingOpen) window.scrollTo(0, 0);
  }
  document.querySelectorAll('nav.sports button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
  go((location.hash || '').slice(1) || 'edition');
})();
</script>

</body>
</html>
